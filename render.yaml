services:
  - type: web
    name: ladybug-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && bash scripts/setup_pot.sh
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_KEYS            # auto-generated secret; read it in Render dashboard > Environment
        generateValue: true
      - key: STORAGE_DIR
        value: /tmp/ladybug-files   # ephemeral on free plan; see README for persistent disk
      - key: MAX_FILE_MB
        value: "25"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: MEDIA_MAX_MB
        value: "100"
      - key: MEDIA_MAX_MINUTES
        value: "20"
      - key: MEDIA_TTL_MINUTES
        value: "30"
      - key: MAX_STORAGE_MB       # downloads over this size are deleted oldest-first
        value: "400"
      - key: MIN_FREE_MB          # if free disk drops below this, all downloads are deleted
        value: "150"
      - key: YT_COOKIES          # optional: Netscape cookies.txt contents, helps when YouTube shows a bot check
        sync: false
      - key: IMAGE_MODEL
        value: gpt-image-1
      - key: TTS_MODEL
        value: tts-1
      - key: GEMINI_API_KEY      # free key from aistudio.google.com/apikey
        sync: false
      - key: GROQ_API_KEY        # free key from console.groq.com/keys
        sync: false
      - key: AI_PROVIDER         # optional: groq | gemini | openai | anthropic (default: fastest configured key)
        sync: false
      - key: POLLINATIONS_API_KEY  # optional: lifts the keyless AI rate limit
        sync: false
      - key: YT_PROXY            # optional: residential proxy URL(s) if YouTube blocks Render's IPs (comma separated = rotated)
        sync: false
      - key: YT_PO_TOKEN         # optional: manual PO token, e.g. web.gvs+TOKEN
        sync: false
      - key: YT_POT_PROVIDER_URL # optional: bgutil PO-token provider server URL
        sync: false
      - key: VDA_API_KEY         # optional: video-download-api.com key (~$0.0002 per MP3/MP4), works from Render's IP
        sync: false
      - key: COBALT_API_URL      # optional: your own Cobalt instance as an extra YouTube backend
        sync: false
      - key: COBALT_API_KEY
        sync: false
      - key: YTDLP_AUTOUPDATE    # 1 (default) = install the newest yt-dlp nightly at every start; 0 = use requirements.txt only
        value: "1"
