<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Ladybug Console — download media, search free licensed media and music metadata, generate images, run AI, scrape, and use 170+ developer utilities from one place.">
<title>Ladybug API</title>
<link rel="icon" type="image/svg+xml" href="/ui/brand/favicon.svg">
<link rel="apple-touch-icon" href="/ui/brand/apple-touch-icon.png">
<meta name="theme-color" content="#F7F6F3">
<meta property="og:title" content="Ladybug API">
<meta property="og:description" content="One API for media, free licensed media, music metadata, images, AI, scraping, anime and business tools.">
<meta property="og:image" content="/ui/brand/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<script>
  /* set theme before paint so there is no flash */
  (function () {
    try {
      var t = localStorage.getItem('lb_theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="lb-mark" viewBox="0 0 64 64">
<defs><radialGradient id="lbShell" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#F2566A"/><stop offset=".55" stop-color="#D62839"/><stop offset="1" stop-color="#A91628"/></radialGradient><clipPath id="lbClip"><circle cx="32" cy="37" r="24"/></clipPath></defs>
<path d="M25.5 11.5C23.5 6 19.5 4.2 14.5 5M38.5 11.5C40.5 6 44.5 4.2 49.5 5" fill="none" stroke-width="2.6" stroke-linecap="round" style="stroke:var(--mark-ant,var(--mark-ink,#14110F))"/>
<circle cx="32" cy="37" r="24" fill="url(#lbShell)"/>
<g clip-path="url(#lbClip)"><path d="M32 22V62" stroke-width="2.8" style="stroke:var(--mark-ink,#14110F)"/>
<g style="fill:var(--mark-ink,#14110F)"><circle cx="21.5" cy="35" r="4.8"/><circle cx="23.5" cy="49" r="3.6"/><circle cx="42.5" cy="33.5" r="4"/><circle cx="41.5" cy="46.5" r="4.6"/></g>
<path d="M13 40C11.5 30 17 21.5 25 19" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2.4" stroke-linecap="round"/></g>
<path d="M18 22.5C18 13.5 24.5 9 32 9s14 4.5 14 13.5C42 20.5 37 19.6 32 19.6S22 20.5 18 22.5Z" style="fill:var(--mark-head,#14110F)"/>
<g style="fill:var(--mark-eye,#fff)"><circle cx="26.2" cy="15.2" r="1.7"/><circle cx="37.8" cy="15.2" r="1.7"/></g></symbol></svg>
<header class="top">
  <button class="iconbtn navtoggle" id="navtoggle" type="button" aria-label="Open tools menu" aria-expanded="false">&#9776;</button>
  <a class="brand" href="#home" aria-label="Ladybug home">
    <svg class="mark" width="34" height="34" aria-hidden="true"><use href="#lb-mark"/></svg>
    <span class="word">ladybug</span>
  </a>
  <button class="searchbtn" id="palettebtn" type="button" aria-label="Search tools (Ctrl+K)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="st">Search tools</span><span class="kbd">Ctrl K</span>
  </button>
  <div class="usage" id="usage" hidden title="Requests used in the last 24 hours"><span class="un" id="usagenum"></span><span class="ub"><i id="usagebar"></i></span></div>
  <form class="key" id="keyform" autocomplete="off" action="javascript:void(0)">
    <label for="apikey">API key</label>
    <input id="apikey" type="text" name="ladybug-key" autocomplete="off" autocapitalize="off" data-lpignore="true" data-1p-ignore placeholder="Paste your key" spellcheck="false">
    <button type="submit" class="ghost" id="keybtn">Save</button><a href="/pricing" class="ghost" style="text-decoration:none;font-weight:600;color:var(--red,#D62839)" title="Get 50 free test requests or unlimited admin key">Pricing</a>
    <span id="keystate" class="keystate" role="status"></span>
  </form>
  <a class="docs" href="/pricing" style="color:var(--red,#D62839);font-weight:700;margin-right:4px">Pricing & Free Keys</a><button class="iconbtn" id="themebtn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">&#9790;</button>
  <a class="docs" href="/docs" target="_blank" rel="noopener">API docs</a>
</header>
<div class="shell">
  <nav id="nav" aria-label="Tools"></nav>
  <main>
    <div id="tool"></div>
  </main>
</div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<script src="/ui/app.js"></script>

<div class="pr-corner-uptime" id="cornerUptime" title="Click to ping cluster" style="position:fixed;bottom:16px;left:16px;z-index:100;display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:9999px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow-lg);font-size:0.75rem;color:var(--ink);cursor:pointer;backdrop-filter:blur(8px);user-select:none">
  <span style="width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px rgba(29,122,75,0.25);animation:pulse-dot 2s infinite ease-in-out"></span>
  <span style="color:var(--ink2);font-weight:500">API Uptime:</span>
  <strong style="color:var(--ok);font-family:var(--mono);font-weight:700">99.98%</strong>
  <span style="color:var(--ink3)">·</span>
  <span id="cornerLatency" style="font-family:var(--mono);color:var(--ink3)">18ms</span>
</div>

</body>
</html>
